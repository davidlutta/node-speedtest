# NOTE: the top-level `version:` key is obsolete in Compose v2 and has been removed.

services:
  influxdb:
    # 2.x env vars are DOCKER_INFLUXDB_INIT_*; the old INFLUXDB_DB / INFLUXDB_ADMIN_USER
    # names were 1.x-only and were silently ignored by the 2.x image.
    # No armv7 image exists for InfluxDB 2.x -- 32-bit Pi users must point
    # INFLUX_URL at an external InfluxDB host instead of running this service.
    image: influxdb:2.9.1-alpine
    container_name: speedtest_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    env_file: .env
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-speedtest}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_DATABASE:-internetspeed}
      - DOCKER_INFLUXDB_INIT_RETENTION=${INFLUXDB_RETENTION:-52w}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - INFLUXDB_DATABASE=${INFLUXDB_DATABASE:-internetspeed}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
      # Creates the DBRP mapping + v1 auth user the node influx client requires.
      - ./scripts/influxdb-init:/docker-entrypoint-initdb.d:ro
    networks:
      - speedtest-network
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  speedtest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Override to node:22-bookworm-slim when building for 32-bit (armv7) Pi OS.
        NODE_IMAGE: ${NODE_IMAGE:-node:24-trixie-slim}
    image: node-speedtest:local
    container_name: speedtest_app
    restart: unless-stopped
    # Forwards SIGTERM so the graceful-shutdown handlers actually run.
    init: true
    env_file: .env
    environment:
      - NODE_ENV=production
      - INFLUX_URL=influxdb
      # The app reads INFLUXDB_PORT -- the old INFLUX_PORT name never reached it.
      - INFLUXDB_PORT=8086
      - INFLUXDB_DATABASE=${INFLUXDB_DATABASE:-internetspeed}
      - INFLUXDB_USER=${INFLUXDB_USER}
      - INFLUXDB_PASSWORD=${INFLUXDB_PASSWORD}
      # false = bucket/DBRP are provisioned by InfluxDB init (2.x). Only set true for 1.x.
      - INFLUX_MANAGE_DB=${INFLUX_MANAGE_DB:-false}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 */4 * * *}
      - CRON_TIMEZONE=${CRON_TIMEZONE:-Africa/Nairobi}
      - SPEEDTEST_HOST_TAG=${SPEEDTEST_HOST_TAG:-}
      - SPEEDTEST_TIMEOUT_MS=${SPEEDTEST_TIMEOUT_MS:-120000}
      # Comma separated `label:id` pairs; each is tested once per tick.
      - SPEEDTEST_SERVERS=${SPEEDTEST_SERVERS:-}
      - SPEEDTEST_SERVER_ID=${SPEEDTEST_SERVER_ID:-}
      # Tags points with the backend that produced them.
      - SPEEDTEST_SOURCE=${SPEEDTEST_SOURCE:-ookla}
      # Root filesystem is read-only, so the error log must go to the tmpfs.
      - LOG_FILE=/tmp/error.log
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - speedtest-network
    deploy:
      resources:
        limits:
          # The Ookla CLI is a small static binary; Chromium's headroom is gone.
          cpus: '1.00'
          memory: 256M
        reservations:
          memory: 64M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # HOME points here so the Ookla CLI can persist its settings file.
      - /tmp:nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'src/index.js' > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  grafana:
    image: grafana/grafana:13.2.1
    container_name: speedtest_grafana
    restart: unless-stopped
    ports:
      - "4567:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      # Consumed by grafana/provisioning/datasources/influxdb.yml
      - INFLUXDB_DATABASE=${INFLUXDB_DATABASE:-internetspeed}
      - INFLUXDB_USER=${INFLUXDB_USER}
      - INFLUXDB_PASSWORD=${INFLUXDB_PASSWORD}
      # Land on the speed test dashboard instead of an empty home page.
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/speedtest.json
    volumes:
      - grafana_data:/var/lib/grafana
      # Auto-configures the InfluxDB datasource and loads the dashboard.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - speedtest-network
    depends_on:
      influxdb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  influxdb_data:
    driver: local
  influxdb_config:
    driver: local
  grafana_data:
    driver: local

networks:
  speedtest-network:
    driver: bridge
