apiVersion: 1

providers:
  - name: speedtest
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    # Edits made in the UI are kept until the file on disk changes.
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
